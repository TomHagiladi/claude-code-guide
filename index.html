<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מדריך Claude Code</title>
<meta name="description" content="מדריך בעברית לאפליקציית Claude Code - מהכפתור הראשון ועד לעומק הטכני.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Heebo:wght@300;400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="legacy.css">
<style>
/* ---------- Material 3 rules that translate to a docs site ----------
   48px touch targets · 8px grid · state layers 8/10/12% · pill buttons ·
   standard easing 200ms · breakpoints compact <600, medium <840, expanded */
:root{--motion:200ms cubic-bezier(.2,0,0,1);--target:48px}
/* off-canvas via transform, never via a negative inset: an inset past the start edge
   creates unreachable overflow in RTL */
.skip{position:absolute;inset-inline-start:var(--sp-4);top:0;transform:translateY(-150%);background:var(--accent);color:#fff;
  padding:var(--sp-2) var(--sp-4);z-index:100;border-radius:0 0 var(--r-sm) var(--r-sm)}
.skip:focus{transform:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top app bar: 64px */
header.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:var(--sp-4);min-height:64px;padding:var(--sp-2) var(--sp-6)}
.brand{display:flex;align-items:center;gap:var(--sp-3);color:var(--ink);text-decoration:none;white-space:nowrap;min-height:var(--target)}
.brand img{height:34px;width:auto;display:block}
.brand .sep{width:1px;height:22px;background:var(--rule)}
.brand .t{font-family:var(--f-display);font-weight:400;font-size:var(--t-base)}
.brand .lit{font-size:.85em}
nav.tracks{display:flex;gap:var(--sp-1)}
nav.tracks a{display:inline-flex;align-items:center;min-height:40px;padding:0 var(--sp-3);font-size:var(--t-sm);
  color:var(--muted);text-decoration:none;border-radius:999px;transition:background var(--motion)}
nav.tracks a:hover{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink)}
nav.tracks a[aria-current="true"]{color:var(--accent);background:var(--accent-soft)}
.search{flex:1;position:relative;max-width:34rem}
.search input{width:100%;min-height:var(--target);font:inherit;font-size:var(--t-sm);padding:0 var(--sp-4);padding-left:4.5rem;
  border:1px solid var(--rule);border-radius:999px;background:var(--raise);color:var(--ink)}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 1px var(--accent)}
.search input::placeholder{color:var(--muted)}
.search kbd{position:absolute;left:var(--sp-4);top:50%;transform:translateY(-50%);
  font-family:var(--f-mono);font-size:var(--t-xs);color:var(--muted);direction:ltr;pointer-events:none}
.results{position:absolute;top:calc(100% + 4px);inset-inline:0;background:var(--raise);
  border:1px solid var(--rule);border-radius:var(--r-lg);box-shadow:0 8px 24px rgba(0,0,0,.08);
  max-height:60vh;overflow:auto;list-style:none;margin:0;padding:var(--sp-2);z-index:30}
.results[hidden]{display:none}
.results li a{display:block;padding:var(--sp-2) var(--sp-3);border-radius:var(--r-md);color:var(--ink);text-decoration:none;min-height:var(--target)}
.results li a:hover,.results li a:focus{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.results .where{font-size:var(--t-xs);color:var(--muted)}
.results .snip{font-size:var(--t-sm);color:var(--muted);display:block}
.results mark{background:var(--accent-soft);color:inherit;padding:0}
.results .empty{padding:var(--sp-3);color:var(--muted);font-size:var(--t-sm)}
.theme{margin-inline-start:auto;width:var(--target);height:var(--target);background:none;border:1px solid var(--rule);
  border-radius:50%;color:var(--ink);cursor:pointer;font:inherit;font-size:var(--t-base);transition:background var(--motion)}
.theme:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}

main{max-width:76rem;margin:0 auto;padding:var(--sp-8) var(--sp-6);min-height:70vh}

/* ---------- home ---------- */
/* home is centred: a landing page, not a reading page. Tom, 4.9.2026 */
.hero{display:grid;gap:var(--sp-6);margin:var(--sp-6) auto var(--sp-12);justify-items:center;text-align:center;max-width:48rem}
.hero .eyebrow{text-align:center}
.hero h1{font-size:clamp(3rem,7vw,5.25rem);font-weight:400;color:var(--accent);letter-spacing:-.01em;line-height:1.1;margin-top:var(--sp-2)}
.hero .tagline{color:var(--muted);font-size:var(--t-xl);max-width:var(--measure);margin:var(--sp-2) auto 0}
.hero-logo{width:min(15rem,60%);height:auto;display:block;margin:0 auto var(--sp-2)}
.door{background:var(--raise);border:1px solid var(--rule);border-top:4px solid var(--accent);
  border-radius:var(--r-lg);padding:var(--sp-8) var(--sp-6);display:grid;gap:var(--sp-3);max-width:44rem;width:100%;justify-items:center;text-align:center}
.door .eyebrow{text-align:center}
.door h2{font-size:var(--t-2xl)}
.door p{max-width:var(--measure);margin:0 auto}
.door .btns{justify-content:center}
/* the security door: same shape, red rule - the motif colour used for attention */
.door.security{border-top-color:var(--brand-red);padding:var(--sp-6)}
.door.security h2{font-size:var(--t-xl)}
.door.security .btn{border-color:var(--brand-red);color:var(--brand-red)}
.door.security .btn:hover{background:color-mix(in srgb,var(--brand-red) 8%,transparent)}
.two{max-width:64rem;margin:0 auto}
.btns{display:flex;gap:var(--sp-3);flex-wrap:wrap;margin-top:var(--sp-2)}
.btn{display:inline-flex;align-items:center;min-height:var(--target);padding:0 var(--sp-6);border-radius:999px;text-decoration:none;
  font-weight:600;border:1px solid var(--accent);color:var(--accent);transition:background var(--motion)}
.btn:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.btn:active{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.primary:hover{background:color-mix(in srgb,var(--on-brand) 8%,var(--brand))}
.btn.primary:active{background:color-mix(in srgb,var(--on-brand) 12%,var(--brand))}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:var(--sp-4)}
.track{background:var(--raise);border:1px solid var(--rule);border-radius:var(--r-lg);padding:var(--sp-6);
  display:flex;flex-direction:column;gap:var(--sp-3);color:var(--ink);text-decoration:none;transition:border-color var(--motion),background var(--motion)}
.track:hover{border-color:var(--accent);background:color-mix(in srgb,var(--ink) 3%,var(--raise))}
.track h2{font-size:var(--t-xl)}
.track .n{font-family:var(--f-mono);font-size:var(--t-xs);color:var(--muted);direction:ltr;text-align:right}
.track ol{margin:0;padding-inline-start:1.2em;color:var(--muted);font-size:var(--t-sm);columns:2;column-gap:var(--sp-4)}

/* ---------- page ---------- */
.page{display:grid;grid-template-columns:16rem minmax(0,1fr);gap:var(--sp-8);align-items:start}
aside.side{position:sticky;top:5rem;font-size:var(--t-sm);max-height:calc(100vh - 6rem);overflow:auto;padding-bottom:var(--sp-4)}
details.side-compact{display:none;border:1px solid var(--rule);border-radius:var(--r-md);background:var(--raise);margin-bottom:var(--sp-6)}
details.side-compact summary{cursor:pointer;min-height:var(--target);display:flex;align-items:center;padding:0 var(--sp-4);font-weight:600}
details.side-compact .sidebody{padding:0 var(--sp-3) var(--sp-3);font-size:var(--t-sm)}
.side .eyebrow{margin-bottom:var(--sp-2)}
.side .grp{margin:var(--sp-3) 0 var(--sp-1);font-family:var(--f-mono);font-size:var(--t-xs);color:var(--muted);direction:ltr;text-align:right;padding-inline-start:var(--sp-3)}
.side ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.side a{display:flex;align-items:center;min-height:44px;padding:0 var(--sp-3);border-radius:999px;color:var(--muted);
  text-decoration:none;transition:background var(--motion)}
.side a:hover{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink)}
.side a[aria-current="page"]{color:var(--accent);background:var(--accent-soft);font-weight:600}
.side a.soon{opacity:.55}
.side a .new{font-family:var(--f-mono);font-size:.65rem;color:var(--brand-red);margin-inline-start:var(--sp-1)}
article{max-width:44rem;min-width:0}
article>*+*{margin-top:var(--sp-4)}
article h1{margin-bottom:var(--sp-2)}
article h2{margin-top:var(--sp-12);padding-top:var(--sp-4);border-top:1px solid var(--rule)}
article h3{margin-top:var(--sp-8)}
article h4{margin-top:var(--sp-6);font-weight:600}
article p{max-width:var(--measure)}
article blockquote{margin:0;padding:var(--sp-4) var(--sp-6);background:var(--accent-soft);border-radius:var(--r-md);font-size:var(--t-lg);line-height:1.6}
article blockquote p{max-width:none}
article ul,article ol{padding-inline-start:1.4em;max-width:var(--measure)}
article li+li{margin-top:var(--sp-1)}
article hr{border:0;border-top:1px solid var(--rule);margin:var(--sp-8) 0}
article strong{font-weight:700}
article pre{margin:var(--sp-4) 0}
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r-md);background:var(--raise);margin:var(--sp-4) 0}
article table{border-collapse:collapse;width:100%;font-size:var(--t-sm);margin:0}
article th,article td{text-align:right;vertical-align:top;padding:var(--sp-2) var(--sp-3);border-bottom:1px solid var(--rule)}
article th{font-weight:700;background:var(--paper);white-space:nowrap}
article tr:last-child td{border-bottom:0}
.toc{border:1px solid var(--rule);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);background:var(--raise);font-size:var(--t-sm);margin-top:var(--sp-6)}
.toc ol{margin:var(--sp-2) 0 0;padding-inline-start:1.2em;columns:2;column-gap:var(--sp-6);max-width:none}
.toc li{break-inside:avoid;margin:0}
.toc.plain ol{list-style:none;padding:0}
.toc a{text-decoration:none;color:var(--ink);display:inline-block;min-height:32px;line-height:32px;border:0}
.toc a:hover{color:var(--accent)}
.bridge{margin-top:var(--sp-12);padding:var(--sp-4) var(--sp-6);border:1px solid var(--rule);border-inline-start:4px solid var(--brand);border-radius:var(--r-md);background:var(--raise);display:grid;gap:var(--sp-1)}
.bridge .eyebrow{margin:0}
.bridge a{font-weight:600;text-decoration:none;min-height:var(--target);display:inline-flex;align-items:center}
.pager{display:flex;justify-content:space-between;gap:var(--sp-4);margin-top:var(--sp-8);padding-top:var(--sp-6);border-top:1px solid var(--rule);font-size:var(--t-sm)}
.pager a{text-decoration:none;min-height:var(--target);display:inline-flex;flex-direction:column;justify-content:center;border:0}
.pager .k{display:block;font-size:var(--t-xs);color:var(--muted)}
.soonbox{background:var(--raise);border:1px dashed var(--rule);border-radius:var(--r-lg);padding:var(--sp-8);color:var(--muted);display:grid;gap:var(--sp-2);max-width:var(--measure)}

/* ---------- GOV.UK "step by step navigation", on our tokens ----------
   numbered spine · each step expands to its tasks · show/hide all ·
   researched by GDS with low-digital-literacy users, which is our audience */
.sbs-top{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-4);margin-top:var(--sp-8)}
.sbs-all{font:inherit;font-size:var(--t-sm);color:var(--accent);background:none;border:0;cursor:pointer;min-height:var(--target);padding:0 var(--sp-2);text-decoration:underline;border-radius:var(--r-sm)}
.sbs{list-style:none;margin:var(--sp-4) 0 0;padding:0;max-width:44rem}
.sbs-step{position:relative;padding-inline-start:3rem;padding-bottom:var(--sp-6);border-inline-start:2px solid var(--rule);margin-inline-start:1.2rem}
.sbs-step:last-child{border-inline-start-color:transparent}
.sbs-num{position:absolute;inset-inline-start:-1.25rem;top:.25rem;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--paper);border:2px solid var(--brand);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:var(--t-sm);color:var(--accent)}
.sbs-and{font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);direction:ltr;text-align:right;margin:0 0 var(--sp-2)}
.sbs-title{margin:0;font-size:inherit}
.sbs-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);width:100%;min-height:var(--target);text-align:start;font:inherit;font-family:var(--f-display);font-size:var(--t-lg);font-weight:500;background:none;border:0;color:var(--ink);cursor:pointer;padding:var(--sp-2) var(--sp-2);border-radius:var(--r-sm);transition:background var(--motion)}
.sbs-head:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.sbs-head .chev{color:var(--muted);font-size:var(--t-xs);transition:transform var(--motion)}
.sbs-step.open .chev{transform:rotate(180deg)}
.sbs-body{display:none;padding:0 var(--sp-2) var(--sp-2)}
.sbs-step.open .sbs-body{display:block}
.sbs-body p{color:var(--muted);font-size:var(--t-sm);max-width:var(--measure)}
.sbs-tasks{list-style:none;margin:var(--sp-3) 0 0;padding:0;display:grid;gap:var(--sp-2)}
.sbs-tasks a{display:flex;align-items:center;min-height:var(--target);padding:0 var(--sp-4);border-radius:var(--r-md);text-decoration:none;color:var(--ink);border:1px solid var(--rule);background:var(--raise);transition:border-color var(--motion),background var(--motion)}
.sbs-tasks a:hover{border-color:var(--accent);background:color-mix(in srgb,var(--ink) 3%,var(--raise))}
.sbs-tasks a::after{content:'←';margin-inline-start:auto;color:var(--muted)}

/* ---------- Mintlify callout taxonomy: note · tip · warning · info · check · danger ----------
   same names and meanings as code.claude.com, the readers' home */
.callout{border-radius:var(--r-md);padding:var(--sp-4) var(--sp-6);margin:var(--sp-4) 0;border-inline-start:3px solid var(--muted);background:var(--raise)}
.callout>.eyebrow{margin-bottom:var(--sp-1)}
.callout.tip,.callout.check{border-inline-start-color:var(--brand);background:var(--accent-soft)}
.callout.warning{border-inline-start-color:var(--warn);background:var(--warn-soft)}
.callout.danger{border-inline-start-color:var(--brand-red);background:color-mix(in srgb,var(--brand-red) 8%,var(--raise))}
.callout.info,.callout.note{border-inline-start-color:var(--muted);background:var(--raise);border:1px solid var(--rule);border-inline-start:3px solid var(--muted)}
.callout p{max-width:none}
.callout>*+*{margin-top:var(--sp-2)}
article blockquote.callout{font-size:inherit;line-height:var(--lh-body)}

footer.bottom{border-top:1px solid var(--rule);margin-top:var(--sp-12);padding:var(--sp-8) var(--sp-6);
  color:var(--muted);font-size:var(--t-sm);display:flex;flex-wrap:wrap;gap:var(--sp-6);align-items:center;justify-content:space-between}
footer.bottom a{color:var(--muted)}
footer.bottom img{height:44px;width:auto;display:block}
footer.bottom .cols{display:flex;flex-direction:column;gap:var(--sp-1)}

/* medium: sidebar folds into a disclosure above the article */
@media (max-width:840px){
  /* minmax(0,1fr), not 1fr: a bare 1fr can't shrink below a table's min-content width and pushes the page sideways */
  .page{grid-template-columns:minmax(0,1fr)}
  aside.side{display:none}
  details.side-compact{display:block}
  .toc ol{columns:1}
}
/* compact: single column, wrapped app bar */
@media (max-width:600px){
  header.top{flex-wrap:wrap;gap:var(--sp-2);padding:var(--sp-2) var(--sp-4)}
  .brand .t{display:none}
  .search{order:3;flex-basis:100%;max-width:none}
  main{padding:var(--sp-6) var(--sp-4)}
  .track ol{columns:1}
  .btns .btn{flex:1;justify-content:center}
}
</style>
</head>
<body>
<a class="skip" href="#content">דלג לתוכן</a>
<header class="top">
  <a class="brand" href="#/">
    <img class="only-light" src="assets/logo-small.png" alt="תום הגלעדי">
    <img class="only-dark" src="assets/logo-small-dark.png" alt="תום הגלעדי">
    <span class="sep" aria-hidden="true"></span>
    <span class="t">מדריך <span class="lit">Claude Code</span></span>
  </a>
  <nav class="tracks" aria-label="מסלולים" id="tracknav"></nav>
  <div class="search" role="search">
    <label for="q" class="sr">חיפוש במדריך</label>
    <input id="q" type="search" placeholder="חיפוש בשני המסלולים" autocomplete="off" aria-controls="results" aria-expanded="false">
    <kbd>Ctrl K</kbd>
    <ul id="results" class="results" hidden role="listbox" aria-label="תוצאות חיפוש"></ul>
  </div>
  <button class="theme" id="theme" type="button" aria-label="החלף מצב תצוגה">◐</button>
</header>

<main id="content" tabindex="-1"></main>

<footer class="bottom">
  <a href="https://tomhagiladi.com" aria-label="tomhagiladi.com">
    <img class="only-light" src="assets/logo-small.png" alt="תום הגלעדי - Empowering through AI">
    <img class="only-dark" src="assets/logo-small-dark.png" alt="תום הגלעדי - Empowering through AI">
  </a>
  <span class="cols">
    <span>נכתב על ידי <a href="https://tomhagiladi.com">תום הגלעדי</a> · עדכון אחרון <span id="updated" class="lit"></span></span>
    <span><a href="#/accessibility">הצהרת נגישות</a> · <a href="#/legal">הבהרה משפטית</a></span>
  </span>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"
        integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<script>
(function(){
  'use strict';
  const $ = s => document.querySelector(s);
  const main = $('#content');
  let M = null;                 // manifest
  const cache = {};             // file text by path
  let index = [];               // search index

  /* ---------- theme ---------- */
  const root = document.documentElement;
  try{ const t = localStorage.getItem('theme'); if(t) root.setAttribute('data-theme', t); }catch(e){}
  $('#theme').addEventListener('click', () => {
    const dark = root.getAttribute('data-theme') === 'dark' ||
      (!root.getAttribute('data-theme') && matchMedia('(prefers-color-scheme:dark)').matches);
    const next = dark ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('theme', next); }catch(e){}
  });

  /* ---------- helpers ---------- */
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const slug = s => s.trim().replace(/\s+/g,'-').replace(/[^\p{L}\p{N}-]/gu,'').toLowerCase();
  const flat = () => M.tracks.flatMap(t => t.sections.map(s => ({...s, track:t.id, trackTitle:t.title})));
  const find = (track, id) => flat().find(s => s.track === track && s.id === id);
  const stripTags = h => h.replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\s+/g,' ').trim();

  async function load(file){
    if(cache[file]) return cache[file];
    const r = await fetch('content/' + file, {cache:'no-cache'});
    if(!r.ok) throw new Error(file + ' (' + r.status + ')');
    return (cache[file] = await r.text());
  }
  function renderBody(file, text){
    return file.endsWith('.md') ? marked.parse(text) : text;
  }

  /* ---------- post-render: the signature + behaviours ---------- */
  function enhance(el, sec){
    /* the bilingual signature: every inline code literal becomes .lit */
    el.querySelectorAll('code').forEach(c => {
      if(c.closest('pre')) return;
      const s = document.createElement('span'); s.className = 'lit'; s.textContent = c.textContent; c.replaceWith(s);
    });
    /* tables scroll inside their own box; the page never scrolls sideways */
    el.querySelectorAll('table').forEach(t => {
      if(t.parentElement.classList.contains('tbl')) return;
      const w = document.createElement('div'); w.className = 'tbl'; w.setAttribute('tabindex','0'); w.setAttribute('role','region');
      const cap = t.closest('.content-block, .collapsible-inner')?.querySelector('h3,h4');
      w.setAttribute('aria-label', cap ? cap.textContent.trim() : 'טבלה');
      t.replaceWith(w); w.appendChild(t);
    });
    /* heading ids for deep links */
    el.querySelectorAll('h2,h3').forEach(h => { if(!h.id && !h.closest('.collapsible-header')) h.id = slug(h.textContent); });
    /* collapsibles: real disclosure semantics */
    el.querySelectorAll('.collapsible-header').forEach(h => {
      h.setAttribute('role','button'); h.setAttribute('tabindex','0');
      const box = h.parentElement; const set = () => h.setAttribute('aria-expanded', box.classList.contains('open'));
      set();
      const toggle = () => { box.classList.toggle('open'); set(); };
      h.addEventListener('click', toggle);
      h.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); } });
    });
    /* copy buttons on the old div-based code blocks */
    el.querySelectorAll('.code-block').forEach(b => {
      const btn = b.querySelector('.copy-btn'); if(!btn) return;
      btn.type = 'button';
      btn.addEventListener('click', () => {
        const clone = b.cloneNode(true); clone.querySelectorAll('.copy-btn,.code-label').forEach(x => x.remove());
        navigator.clipboard.writeText(clone.textContent.trim()).then(() => {
          const t = btn.textContent; btn.textContent = 'הועתק'; btn.classList.add('done');
          setTimeout(() => { btn.textContent = t; btn.classList.remove('done'); }, 1600);
        });
      });
    });
    /* inspiration filters */
    const bar = el.querySelector('.filter-bar');
    if(bar){
      bar.addEventListener('click', e => {
        const b = e.target.closest('.filter-btn'); if(!b) return;
        bar.querySelectorAll('.filter-btn').forEach(x => { x.classList.toggle('active', x === b); x.setAttribute('aria-pressed', x === b); });
        const cat = b.dataset.filter;
        el.querySelectorAll('.inspiration-card').forEach(c => { c.hidden = !(cat === 'all' || c.dataset.category === cat); });
      });
      bar.querySelectorAll('.filter-btn').forEach(x => x.setAttribute('aria-pressed', x.classList.contains('active')));
    }
    /* callouts: one taxonomy for the old boxes, the deep-track quotes and the new chapters */
    const KINDS = {'טיפ':'tip','הערה':'note','שים לב':'note','חשוב':'warning','אזהרה':'warning','זהירות':'warning','מידע':'info','בדיקה':'check','סכנה':'danger'};
    const callout = (box, kind) => {
      box.classList.add('callout', kind);
      if(!box.querySelector(':scope > .eyebrow')){ const e = document.createElement('p'); e.className = 'eyebrow'; e.textContent = kind; box.prepend(e); }
    };
    el.querySelectorAll('.info-box').forEach(b => callout(b, /^\s*טיפ/.test(b.textContent) ? 'tip' : 'note'));
    el.querySelectorAll('.warning-box').forEach(b => callout(b, 'warning'));
    el.querySelectorAll('blockquote').forEach(q => {
      const s = q.querySelector(':scope > p:first-child > strong:first-child'); if(!s) return;
      const kind = KINDS[s.textContent.replace(/[:\s]+$/, '').trim()]; if(!kind) return;
      const p = s.parentElement; s.remove();
      if(p.firstChild && p.firstChild.nodeType === 3) p.firstChild.textContent = p.firstChild.textContent.replace(/^[:\s-]+/, '');
      callout(q, kind);
    });
    /* external links open in a new tab */
    el.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
    /* in-page table of contents for long pages */
    const h2s = [...el.querySelectorAll('h2')];
    if(h2s.length >= 4){
      const toc = document.createElement('nav'); toc.className = 'toc'; toc.setAttribute('aria-label','בעמוד הזה');
      /* headings that already carry their own numbers get no list markers */
      if(h2s.filter(h => /^\d+\./.test(h.textContent.trim())).length > h2s.length / 2) toc.classList.add('plain');
      toc.innerHTML = `<p class="eyebrow">on this page</p><ol>${h2s.map(h => `<li><a href="#/${sec.track}/${sec.id}#${h.id}">${esc(h.textContent)}</a></li>`).join('')}</ol>`;
      const anchor = el.querySelector('.lede') || el.querySelector('blockquote') || el.querySelector('h1');
      if(anchor) anchor.after(toc);
    }
  }

  /* ---------- views ---------- */
  function home(){
    const d = M.front_door;
    main.innerHTML = `
      <section class="hero">
        <div>
          <img class="hero-logo only-light" src="assets/logo.png" alt="תום הגלעדי - Empowering through AI">
          <img class="hero-logo only-dark" src="assets/logo-dark.png" alt="תום הגלעדי - Empowering through AI">
          <p class="eyebrow">${esc('hebrew · rtl · ' + M.site.updated)}</p>
          <h1>${esc(M.site.title)}</h1>
          <p class="tagline">${esc(M.site.tagline)}</p>
        </div>
        <div class="door">
          <p class="eyebrow"><span class="frame" aria-hidden="true"></span>${esc(d.eyebrow)}</p>
          <h2>${esc(d.title)}</h2>
          <p>${esc(d.blurb)}</p>
          <div class="btns">
            <a class="btn primary" href="${d.primary.href}">${esc(d.primary.label)}</a>
            <a class="btn" href="${d.secondary.href}">${esc(d.secondary.label)}</a>
          </div>
        </div>
        ${M.security_door ? `<div class="door security">
          <p class="eyebrow"><span class="frame" aria-hidden="true"></span>${esc(M.security_door.eyebrow)}</p>
          <h2>${esc(M.security_door.title)}</h2>
          <p>${esc(M.security_door.blurb)}</p>
          <div class="btns"><a class="btn" href="${M.security_door.href}">${esc(M.security_door.label)}</a></div>
        </div>` : ''}
      </section>
      <div class="two">${M.tracks.map(t => `
        <a class="track" href="#/${t.id}">
          <span class="n">${t.sections.length} sections</span>
          <h2>${esc(t.title)}</h2>
          <p class="muted">${esc(t.blurb)}</p>
          <ol>${t.sections.slice(0,12).map(s => `<li>${esc(s.title)}</li>`).join('')}</ol>
        </a>`).join('')}
      </div>`;
    document.title = M.site.title;
  }

  function sideList(track, current){
    const t = M.tracks.find(x => x.id === track);
    let html = `<p class="eyebrow">${esc(t.id)}</p><h3 style="margin-bottom:var(--sp-2)">${esc(t.title)}</h3><ol>`;
    let lastGroup = null;
    t.sections.forEach(s => {
      if(s.group && s.group !== lastGroup){ html += `</ol><div class="grp">${esc(s.group)}</div><ol>`; lastGroup = s.group; }
      const cur = s.id === current ? 'aria-current="page"' : '';
      const soon = s.file ? '' : 'class="soon" title="בקרוב"';
      html += `<li><a href="#/${t.id}/${s.id}" ${cur} ${soon}>${esc(s.title)}${s.new ? '<span class="new">new</span>' : ''}</a></li>`;
    });
    return html + '</ol>';
  }
  function sidebar(track, current){
    const list = sideList(track, current);
    const t = M.tracks.find(x => x.id === track);
    return `<aside class="side" aria-label="תוכן המסלול">${list}</aside>
      <details class="side-compact"><summary>תוכן המסלול: ${esc(t.title)}</summary><div class="sidebody side">${list}</div></details>`;
  }

  function pager(sec){
    const all = flat().filter(s => s.track === sec.track);
    const i = all.findIndex(s => s.id === sec.id);
    const prev = all[i-1], next = all[i+1];
    const link = (s, k) => s ? `<a href="#/${s.track}/${s.id}"><span class="k">${k}</span>${esc(s.title)}</a>` : '<span></span>';
    return `<nav class="pager" aria-label="דפדוף">${link(prev,'הקודם')}${link(next,'הבא')}</nav>`;
  }
  function bridge(sec){
    if(!sec.bridge) return '';
    const b = sec.bridge;
    return `<aside class="bridge"><p class="eyebrow">${esc(b.eyebrow || 'bridge')}</p><span>${esc(b.text)}</span><a href="${b.href}">${esc(b.label)} ←</a></aside>`;
  }

  async function page(track, id){
    const sec = find(track, id);
    if(!sec){ return notfound(); }
    let body;
    if(sec.file){
      try{ body = renderBody(sec.file, await load(sec.file)); }
      catch(e){ body = `<h1>${esc(sec.title)}</h1><div class="soonbox"><h2>לא הצלחתי לטעון את הפרק</h2><p>${esc(String(e))}</p></div>`; }
    } else {
      body = `<h1>${esc(sec.title)}</h1><div class="soonbox"><p class="eyebrow">coming soon</p><h2>הפרק הזה עדיין נכתב</h2></div>`;
    }
    main.innerHTML = `<div class="page">${sidebar(track, id)}<article>${body}${bridge(sec)}${pager(sec)}</article></div>`;
    enhance(main.querySelector('article'), sec);
    document.title = `${sec.title} · ${M.site.title}`;
  }

  /* GOV.UK step-by-step: intro, numbered steps that expand to tasks, show/hide all */
  function stepByStep(t){
    if(!t.steps) return '';
    return `<div class="sbs-top"><p class="eyebrow">step by step</p><button type="button" class="sbs-all" aria-expanded="false">הצג את כל הצעדים</button></div>
      <ol class="sbs">${t.steps.map((s, i) => `
        <li class="sbs-step${i === 0 ? ' open' : ''}">
          ${s.connector ? `<p class="sbs-and">${esc(s.connector)}</p>` : ''}
          <span class="sbs-num" aria-hidden="true">${i + 1}</span>
          <h2 class="sbs-title"><button type="button" class="sbs-head" aria-expanded="${i === 0}"><span>צעד ${i + 1}: ${esc(s.title)}</span><span class="chev" aria-hidden="true">▼</span></button></h2>
          <div class="sbs-body">${s.blurb ? `<p>${esc(s.blurb)}</p>` : ''}
            <ul class="sbs-tasks">${s.tasks.map(k => `<li><a href="${k.href}">${esc(k.label)}</a></li>`).join('')}</ul>
          </div>
        </li>`).join('')}</ol>`;
  }
  function bindStepByStep(){
    const all = main.querySelector('.sbs-all'); if(!all) return;
    const steps = [...main.querySelectorAll('.sbs-step')];
    const set = (li, open) => { li.classList.toggle('open', open); li.querySelector('.sbs-head').setAttribute('aria-expanded', open); };
    main.querySelectorAll('.sbs-head').forEach(b => b.addEventListener('click', () => set(b.closest('.sbs-step'), !b.closest('.sbs-step').classList.contains('open'))));
    all.addEventListener('click', () => {
      const open = all.getAttribute('aria-expanded') !== 'true';
      steps.forEach(li => set(li, open));
      all.setAttribute('aria-expanded', open); all.textContent = open ? 'הסתר את כל הצעדים' : 'הצג את כל הצעדים';
    });
  }

  function trackHome(track){
    const t = M.tracks.find(x => x.id === track);
    if(!t) return notfound();
    const first = t.sections.find(s => s.file) || t.sections[0];
    main.innerHTML = `<div class="page">${sidebar(track, null)}
      <article><p class="eyebrow">${esc(t.id)}</p><h1>${esc(t.title)}</h1><p class="muted" style="margin-top:var(--sp-2)">${esc(t.blurb)}</p>
      ${t.steps ? stepByStep(t) : `<div class="btns"><a class="btn primary" href="#/${t.id}/${first.id}">התחל: ${esc(first.title)}</a></div>`}</article></div>`;
    bindStepByStep();
    document.title = `${t.title} · ${M.site.title}`;
  }

  async function staticPage(kind){
    const titles = { accessibility:'הצהרת נגישות', legal:'הבהרה משפטית' };
    let body = '';
    try{ body = await load(kind + '.html'); }catch(e){ body = '<p>הדף בהכנה.</p>'; }
    main.innerHTML = `<article><h1>${esc(titles[kind])}</h1>${body}</article>`;
    enhance(main.querySelector('article'), {track:'', id:kind});
    document.title = `${titles[kind]} · ${M.site.title}`;
  }

  function notfound(){
    main.innerHTML = `<article><h1>הדף לא נמצא</h1><p style="margin-top:var(--sp-4)"><a href="#/">חזרה לדף הבית</a></p></article>`;
  }

  /* ---------- router (the hashchange listener the old guide never had) ---------- */
  function jump(anchor){
    if(!anchor){ window.scrollTo(0,0); return; }
    const el = document.getElementById(anchor); if(!el) return window.scrollTo(0,0);
    const box = el.closest('.collapsible'); if(box){ box.classList.add('open'); box.querySelector('.collapsible-header')?.setAttribute('aria-expanded','true'); }
    el.scrollIntoView();
  }
  /* links shared from the old single-file guide (#inspiration, #faq ...) keep working */
  const LEGACY = { home:'', what:'what-is', install:'install', 'first-steps':'first-step', inspiration:'inspiration',
    skills:'skills-plugins', claudemd:'claude-md', tips:'tips-commands', 'best-practices':'best-practices', faq:'faq' };
  function route(){
    const raw = location.hash.replace(/^#/, '');
    if(raw && !raw.startsWith('/') && raw in LEGACY){ location.replace(LEGACY[raw] ? `#/beginners/${LEGACY[raw]}` : '#/'); return; }
    const h = location.hash.replace(/^#\/?/, '');
    const [a, b, anchor] = h.split(/[\/#]/);
    highlightTrack(a);
    closeResults(); q.value = '';
    if(!a){ home(); return window.scrollTo(0,0); }
    if(a === 'accessibility' || a === 'legal'){ staticPage(a).then(() => window.scrollTo(0,0)); return; }
    if(!b){ trackHome(a); return window.scrollTo(0,0); }
    page(a, b).then(() => jump(anchor));
  }
  function highlightTrack(id){
    $('#tracknav').querySelectorAll('a').forEach(a => a.setAttribute('aria-current', a.dataset.t === id ? 'true' : 'false'));
  }
  window.addEventListener('hashchange', route);

  /* ---------- search: one box over both tracks, markdown and html alike ---------- */
  async function buildIndex(){
    for(const s of flat().filter(x => x.file)){
      try{
        const text = await load(s.file);
        let blocks;
        if(s.file.endsWith('.md')){
          blocks = text.split(/\n(?=#{1,3} )/).map(b => {
            const m = b.match(/^(#{1,3}) (.+)/);
            const heading = m ? m[2].trim() : s.title;
            return { heading, anchor: m && m[1].length > 1 ? slug(heading) : '', body: b.replace(/^#{1,3} .+/, '').replace(/```[\s\S]*?```/g,' ').replace(/<[^>]+>/g,' ').replace(/[`*>|#_-]/g,' ') };
          });
        } else {
          blocks = text.split(/(?=<h[23][\s>])/).map(b => {
            const m = b.match(/^<h[23][^>]*>([\s\S]*?)<\/h[23]>/);
            const heading = m ? stripTags(m[1]) : s.title;
            return { heading, anchor: m ? slug(heading) : '', body: stripTags(b.replace(/^<h[23][^>]*>[\s\S]*?<\/h[23]>/,'')) };
          });
        }
        blocks.forEach(b => index.push({ track:s.track, trackTitle:s.trackTitle, id:s.id, page:s.title, heading:b.heading, anchor:b.anchor, body:b.body.replace(/\s+/g,' ').trim() }));
      }catch(e){}
    }
    flat().filter(s => !s.file).forEach(s => index.push({ track:s.track, trackTitle:s.trackTitle, id:s.id, page:s.title, heading:s.title, anchor:'', body:'' }));
  }
  function search(q){
    q = q.trim().toLowerCase();
    if(q.length < 2) return [];
    const terms = q.split(/\s+/);
    return index.map(e => {
      const hay = (e.page + ' ' + e.heading + ' ' + e.body).toLowerCase();
      let score = 0;
      for(const t of terms){
        if(!hay.includes(t)) return null;
        if(e.heading.toLowerCase().includes(t)) score += 5;
        if(e.page.toLowerCase().includes(t)) score += 3;
        score += 1;
      }
      const pos = e.body.toLowerCase().indexOf(terms[0]);
      const snip = pos >= 0 ? e.body.slice(Math.max(0,pos-50), pos+90) : e.body.slice(0,120);
      return { e, score, snip };
    }).filter(Boolean).sort((a,b) => b.score - a.score).slice(0, 14);
  }
  const q = $('#q'), res = $('#results');
  function renderResults(list, query){
    if(!list.length){ res.innerHTML = `<li class="empty">לא נמצא "${esc(query)}"</li>`; }
    else res.innerHTML = list.map(({e, snip}) => {
      const href = `#/${e.track}/${e.id}${e.anchor ? '#' + e.anchor : ''}`;
      const s = esc(snip).replace(new RegExp('(' + query.trim().split(/\s+/).map(t => t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|') + ')', 'gi'), '<mark>$1</mark>');
      return `<li role="option"><a href="${href}"><span class="where">${esc(e.trackTitle)} · ${esc(e.page)}</span><br>${esc(e.heading)}<span class="snip">${s}</span></a></li>`;
    }).join('');
    res.hidden = false; q.setAttribute('aria-expanded', 'true');
  }
  function closeResults(){ res.hidden = true; q.setAttribute('aria-expanded', 'false'); }
  q.addEventListener('input', () => { const v = q.value; if(v.trim().length < 2) return closeResults(); renderResults(search(v), v); });
  q.addEventListener('keydown', e => { if(e.key === 'Escape'){ q.value=''; closeResults(); q.blur(); } });
  res.addEventListener('click', () => { closeResults(); q.value=''; });
  document.addEventListener('click', e => { if(!e.target.closest('.search')) closeResults(); });
  document.addEventListener('keydown', e => { if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); q.focus(); q.select(); } });

  /* ---------- boot ---------- */
  fetch('content/index.json', {cache:'no-cache'}).then(r => r.json()).then(m => {
    M = m;
    $('#updated').textContent = m.site.updated;
    $('#tracknav').innerHTML = m.tracks.map(t => `<a href="#/${t.id}" data-t="${t.id}">${esc(t.title)}</a>`).join('');
    route();
    buildIndex();
  }).catch(e => { main.innerHTML = `<article><h1>שגיאה בטעינת המדריך</h1><p>${esc(String(e))}</p><p>אם פתחת את הקובץ ישירות מהדיסק, צריך שרת מקומי.</p></article>`; });

  /* analytics only on the public address, never on local previews */
  if(location.hostname.endsWith('github.io')){
    const s = document.createElement('script'); s.async = true; s.src = 'https://www.googletagmanager.com/gtag/js?id=G-J7FE9WQ5YY'; document.head.appendChild(s);
    window.dataLayer = window.dataLayer || []; function gtag(){ dataLayer.push(arguments); } gtag('js', new Date()); gtag('config', 'G-J7FE9WQ5YY');
  }
})();
</script>
